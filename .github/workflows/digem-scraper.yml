name: dig-em Scraper Pipeline

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 00:00 UTC (한국 시간 09:00)

  workflow_dispatch:

env:
  AIRFLOW_HOME: /tmp/airflow  # GitHub Actions는 절대 경로 필요
  PYTHONPATH: .
  AIRFLOW__CORE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow.db  # SQLite 절대 경로
  AIRFLOW__CORE__LOAD_EXAMPLES: false  # 예제 DAG 로드 방지
  AIRFLOW__CORE__DAGS_FOLDER: /home/runner/work/digem/digem/airflow/dags
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install apache-airflow==2.10.0

      - name: Initialize Airflow
        run: |
          airflow db init
          airflow users create \
            --username admin \
            --password admin \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com || true

      - name: Validate DAG
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from airflow.dags.digem_scraper_pipeline import dag
          print(f'DAG ID: {dag.dag_id}')
          print(f'Tasks: {len(dag.tasks)}')
          for task in dag.tasks:
            print(f'  - {task.task_id}')
          "

      # dags test 는 스케줄러 없이 동기 실행한다. Actions 에는 스케줄러가 없다.
      - name: Run Airflow DAG
        run: |
          airflow dags test digem_scraper_pipeline

      - name: Notify Success
        if: success()
        run: |
          echo "✅ DAG 실행 성공!"
          echo "DAG ID: digem_scraper_pipeline"

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ DAG 실행 실패!"
          echo "자세한 로그는 GitHub Actions에서 확인하세요"
